# The checks that have to pass before a change is believed.
#
# Postgres and Redis are services rather than mocks, for the same reason the
# tests are written that way: what is being tested is how this server behaves
# against the real thing, and a mock only tests the mock.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ycollab
          POSTGRES_PASSWORD: ycollab
          POSTGRES_DB: ycollab
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ycollab -d ycollab"
          --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # A patch release, not a major line: govulncheck reports standard
          # library advisories, and the fix for those is the toolchain.
          go-version: "1.26.9"
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Pinned to the version this was actually run against: an analyser that
      # updates itself turns an unrelated change into a red build.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      # The SigV4 signer in internal/blob is hand-rolled, so it is checked
      # against a real S3 implementation rather than against a mock that would
      # agree with its own mistakes. Without it every S3 test skips itself,
      # which is a green build that checked nothing - and the object storage
      # path is where a bug costs a document rather than a request.
      #
      # A step rather than a service container because the bucket has to be
      # created before the integration tests run.
      - name: object storage
        run: |
          docker run -d --name rustfs -p 9002:9000 \
            -e RUSTFS_ACCESS_KEY=ycollab -e RUSTFS_SECRET_KEY=ycollab-secret \
            --tmpfs /data rustfs/rustfs:1.0.1
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:9002/health/ready > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9002/health/ready > /dev/null
          aws --endpoint-url http://127.0.0.1:9002 s3api create-bucket --bucket ycollab
        env:
          AWS_ACCESS_KEY_ID: ycollab
          AWS_SECRET_ACCESS_KEY: ycollab-secret
          AWS_DEFAULT_REGION: us-east-1

      # The race detector is not optional here: the whole design is one actor
      # goroutine per document with no locks, and that is a claim, not a fact,
      # until something checks it.
      - name: test
        env:
          YCOLLAB_TEST_DATABASE_URL: postgres://ycollab:ycollab@127.0.0.1:5433/ycollab
          YCOLLAB_TEST_REDIS_URL: redis://127.0.0.1:6380
          YCOLLAB_TEST_S3_ENDPOINT: http://127.0.0.1:9002
        run: go test -race -count=1 -timeout 900s ./...

  # The wire guarantee is the point of the project, so it is checked on every
  # change: the Go engine re-encodes every fixture byte for byte, and real Yjs
  # accepts what it produced.
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install the reference libraries
        working-directory: tools/fixturegen
        run: npm ci

      - name: re-encode every fixture with the Go engine
        run: |
          mkdir -p /tmp/dump
          go run ./cmd/ycollab-dump -out /tmp/dump

      - name: apply the Go output in a real Y.Doc
        run: |
          failed=0
          for file in /tmp/dump/*.bin; do
            name=$(basename "$file" .bin)
            if ! node tools/verify/apply.mjs --fixture "$name" --update "$file" > /dev/null; then
              echo "real Yjs rejected $name"
              failed=1
            fi
          done
          exit $failed

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # A soak against a real server, short enough to run on every change. The long
  # one is a manual run; this one exists to catch a fanout or awareness
  # regression before it reaches a branch.
  soak:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install the reference libraries
        working-directory: tools/fixturegen
        run: npm ci

      - name: two replicas, real clients across both
        run: |
          go build -o /tmp/ycollab-server ./cmd/server
          /tmp/ycollab-server -addr 127.0.0.1:8081 -admin-addr 127.0.0.1:6081 \
            -redis-url redis://127.0.0.1:6380 -log-level warn &
          /tmp/ycollab-server -addr 127.0.0.1:8082 -admin-addr 127.0.0.1:6082 \
            -redis-url redis://127.0.0.1:6380 -log-level warn &
          for port in 8081 8082; do
            until curl -sf "http://127.0.0.1:$port/healthz" > /dev/null; do sleep 1; done
          done
          node tools/soak/soak.mjs --clients 4 --duration 20 \
            --urls ws://127.0.0.1:8081,ws://127.0.0.1:8082 \
            --stats http://127.0.0.1:6081,http://127.0.0.1:6082

      - name: load
        run: |
          go build -o /tmp/ycollab-load ./cmd/ycollab-load
          /tmp/ycollab-load -url ws://127.0.0.1:8081 -clients 200 -rooms 20 -duration 15s -rate 4

  # The npm package, against real server processes. It is a separate job because
  # it needs Go and Node but neither database: what it tests is the client's
  # behaviour on a connection - a token being refreshed, a refusal being
  # reported, a subdocument being connected - and none of that touches storage.
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: install
        working-directory: client
        run: npm ci

      - name: test
        working-directory: client
        run: npm test

  # The demo page. It has no tests - it is a page, and what it demonstrates is
  # already covered by the soak job against real clients - but it does have a
  # dependency tree that can stop resolving and an import that can stop
  # existing, and a demo that does not build is a broken first impression for
  # somebody following the quickstart.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        working-directory: web
        run: npm ci

      - name: build
        working-directory: web
        run: npm run build
